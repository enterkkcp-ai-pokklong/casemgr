name: CaseMgr tick backup (tk1)
on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send tick to GAS
        env:
          TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
          TICK_URL: ${{ secrets.TICK_URL }}
        run: |
          if [ -z "$TICK_TOKEN" ] || [ -z "$TICK_URL" ]; then
            echo "TICK_TOKEN หรือ TICK_URL ยังไม่ตั้ง — ข้าม"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${TICK_URL}?action=tick&token=${TICK_TOKEN}")
          echo "HTTP status: $STATUS"
